name: Deploy

# Uploads the site to Hostinger (adddots.com) after every push to main, or when
# run by hand from Actions → Deploy → Run workflow.
# Needs repository secrets FTP_SERVER, FTP_USERNAME and FTP_PASSWORD (see README).
# Only files this workflow uploaded are ever replaced or removed, so other folders
# on the server (optionbuilder/, pdfreader/, the APK in adddotsmain/addcall/) are left alone.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://adddots.com
    steps:
      - uses: actions/checkout@v4

      # Accepts FTP_SERVER pasted as "ftp://host:21/" or with stray spaces, and
      # says what's wrong (without printing the secret) if it still isn't a host name.
      - name: Check FTP secrets
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -z "$FTP_SERVER" ] || [ -z "$FTP_USERNAME" ] || [ -z "$FTP_PASSWORD" ]; then
            echo "::error::Add the FTP_SERVER, FTP_USERNAME and FTP_PASSWORD secrets to deploy (see README)."
            exit 1
          fi
          host=$(printf '%s' "$FTP_SERVER" | tr -d '[:space:]')
          case "$host" in *://*) host=${host#*://} ;; esac
          host=${host%%/*}
          host=${host%%:*}
          echo "::add-mask::$host"
          if ! [[ "$host" =~ ^[0-9]{1,3}(\.[0-9]{1,3}){3}$ ]] && ! getent hosts "$host" > /dev/null; then
            echo "::error::FTP_SERVER is not a host name that exists. Use the FTP hostname or IP from hPanel → Files → FTP Accounts, nothing else."
            exit 1
          fi
          echo "FTP_HOST=$host" >> "$GITHUB_ENV"
          # FTP_SERVER_DIR works as a variable or a secret; ./ when the account opens in the site folder.
          dir=$(printf '%s' "${{ vars.FTP_SERVER_DIR || secrets.FTP_SERVER_DIR }}" | tr -d '[:space:]')
          dir=${dir#/}
          if [ -z "$dir" ]; then dir=./; fi
          case "$dir" in */) ;; *) dir="$dir/" ;; esac
          echo "Uploading into: $dir"
          echo "FTP_DIR=$dir" >> "$GITHUB_ENV"

      # Lists the folder the upload goes into (names only) and stops unless it is
      # adddots.com's live folder, recognised by the call/ folder (call.adddots.com)
      # it holds. Hostinger's certificate names another host, hence -k, as the
      # upload itself does.
      - name: Check the upload folder is the website
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          for h in adddots.com ftp.adddots.com call.adddots.com; do
            echo "$h -> $(getent ahostsv4 "$h" | awk 'NR==1{print $1}')"
          done
          echo "What the live site serves now:"
          for u in / /addcall/ /addcall/add-call.apk /about.html /call/ /cabinetbuilder/ /optionbuilder/ /pdf/ /app/; do
            echo "  https://adddots.com$u -> $(curl -s -o /dev/null -w '%{http_code}' "https://adddots.com$u")"
          done
          echo "  home page mentions Applications: $(curl -s https://adddots.com/ | grep -c Applications)"
          # Which Hostinger server each FTP hostname points to, and what this login sees on each.
          for h in ftp.adddots.com ftp.call.adddots.com ftp.pdf.adddots.com ftp.optionbuilder.adddots.com; do
            ip=$(getent ahostsv4 "$h" | awk 'NR==1{print $1}')
            [ -z "$ip" ] && { echo "$h -> (none)"; continue; }
            echo "$h -> $ip: $(curl -sS -k --ssl-reqd --list-only -u "$FTP_USERNAME:$FTP_PASSWORD" "ftp://$ip/" 2>&1 | tr -d '\r' | tr '\n' ' ' | cut -c1-300)"
          done
          # Show what is under domains/ so we can find the folder adddots.com serves.
          ls_ftp() { curl -sS -k --ssl-reqd --list-only -u "$FTP_USERNAME:$FTP_PASSWORD" "ftp://$FTP_HOST/$1" 2>&1 | tr -d '\r' | grep -vx '\.\.\?' | tr '\n' ' '; }
          echo "domains/: $(ls_ftp domains/)"
          for d in $(curl -sS -k --ssl-reqd --list-only -u "$FTP_USERNAME:$FTP_PASSWORD" "ftp://$FTP_HOST/domains/" 2>/dev/null | tr -d '\r' | grep -vx '\.\.\?'); do
            echo "domains/$d/: $(ls_ftp "domains/$d/")"
            echo "domains/$d/public_html/: $(ls_ftp "domains/$d/public_html/")"
          done
          echo "staging/: $(ls_ftp staging/)"
          target="ftp://$FTP_HOST/"
          if [ "$FTP_DIR" != "./" ]; then target="ftp://$FTP_HOST/$FTP_DIR"; fi
          names=$(curl -sS -k --ssl-reqd --list-only -u "$FTP_USERNAME:$FTP_PASSWORD" "$target" | tr -d '\r')
          echo "Upload folder contains:"
          printf '%s\n' "$names" | sed 's/^/  /'
          if ! printf '%s\n' "$names" | grep -qx 'call'; then
            echo "::error::This FTP login does not open in adddots.com's public_html (no call/ folder there). Use the u858015397.main account with server ftp.adddots.com (see README)."
            exit 1
          fi

      # One-time move: everything but index.html now lives in adddotsmain/. Renames
      # the files an earlier deploy put at the top level (addcall/ moves whole, so
      # the APK in it goes along) and drops the old sync state so the upload below
      # starts fresh instead of deleting anything. Does nothing once moved.
      - name: Move the site into adddotsmain/
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          ftp() { curl -sS -k --ssl-reqd -u "$FTP_USERNAME:$FTP_PASSWORD" "$@"; }
          base="ftp://$FTP_HOST/"
          if [ "$FTP_DIR" != "./" ]; then base="ftp://$FTP_HOST/$FTP_DIR"; fi
          names=$(ftp --list-only "$base" | tr -d '\r')
          if ! printf '%s\n' "$names" | grep -qx 'about.html'; then
            echo "Already moved."
            exit 0
          fi
          cmds=(-Q "*MKD adddotsmain")
          for f in about.html addcall apple-touch-icon.png favicon.ico favicon.svg founder.jpg icon-192.png icon-512.png; do
            printf '%s\n' "$names" | grep -qx "$f" && cmds+=(-Q "RNFR $f" -Q "RNTO adddotsmain/$f")
          done
          cmds+=(-Q "*DELE .ftp-deploy-sync-state.json")
          ftp --list-only "${cmds[@]}" "$base" > /dev/null
          echo "Now in adddotsmain/:"
          ftp --list-only "${base}adddotsmain/" | tr -d '\r' | sed 's/^/  /'

      - uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ env.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./
          # The site's folder on the server, worked out in "Check FTP secrets".
          server-dir: ${{ env.FTP_DIR }}
          exclude: |
            **/.git*
            **/.git*/**
            README.md
          dangerous-clean-slate: false
          log-level: standard
